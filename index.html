<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин шоколада</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <div class="product-card" data-name="Корзинка" data-price="700.0">
            <div class="gallery">
                <img src="products/1.jpg" class="product-image" loading="lazy" alt="Корзинка">
            </div>
            <h3>Корзинка</h3>
            <p class="price">700.0 ₽</p>
            <button class="add-to-cart" onclick="addToCart(this)">В корзину</button>
        </div>
        <div class="product-card" data-name="Помада" data-price="150.0">
            <div class="gallery">
                <img src="products/2.jpg" class="product-image" loading="lazy" alt="Помада">
            </div>
            <h3>Помада</h3>
            <p class="price">150.0 ₽</p>
            <button class="add-to-cart" onclick="addToCart(this)">В корзину</button>
        </div>
    </div>
    <!-- Модальные окна -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span id="close-cart-button" class="close">&times;</span>
            <h3>Ваша корзина</h3>
            <div id="cart-items"></div>
            <div class="total">Итого: <span id="total">0</span> ₽</div>
            <button id="checkout-button" class="Button">Оформить заказ</button>
        </div>
    </div>

    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <button id="close-checkout-button" class="close">&times;</button>
            <h3>Оформление заказа</h3>
            <form id="checkout-form">
                <input type="text" id="name" placeholder="Имя" required>
                <input type="tel" id="phone" placeholder="Телефон" required>
                <button type="submit" class="Button">Отправить заказ</button>
            </form>
        </div>
    </div>

    <button id="open-cart-button" class="cart-button">
        🛒 Корзина
        <span id="cart-counter" class="counter"></span>
    </button>
    <script src="script.js" defer></script>
</body>
</html>
